[workspace]
resolver = "3"
members = ["crates/ckfile", "crates/ckscene", "crates/ckscript", "crates/ballistic-bundle", "crates/ballistic-pack", "crates/ballistic-physics", "crates/ballistic-render", "crates/ballistic-save", "apps/ballistic-viewer", "tools/ckinspect"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
authors = ["Tomasz Król <tomicode@gmail.com>"]

[workspace.dependencies]
ckfile = { path = "crates/ckfile" }
ckscene = { path = "crates/ckscene" }
ckscript = { path = "crates/ckscript" }
image = { version = "0.25", default-features = false, features = ["bmp", "tga", "png"] }
flate2 = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
anyhow = "1"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
cast_possible_truncation = "allow"
must_use_candidate = "allow"
many_single_char_names = "allow"
cast_precision_loss = "allow"
